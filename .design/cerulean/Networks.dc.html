<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
    a { color: #2F6FE0; } a:hover { color: #1F4FA8; }
    .t { font-size: 12px; line-height: 18px; }
    .m { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; line-height: 18px; }
  </style>
</helmet>

<div style="width: 800px; height: 480px; display: flex; flex-direction: column; background: #E9EAEC; color: #1A1D21; overflow: hidden">

  <div style="height: 22px; flex-shrink: 0; background: #1F242A; display: flex; align-items: center; padding: 0 6px">
    <div class="t" style="color: #D6D9DD; width: 16px">e</div>
    <div class="t" style="background: #2F6FE0; color: #FFFFFF; padding: 0 8px; height: 22px; display: flex; align-items: center">IRC</div>
    <div class="t" style="color: #D6D9DD; padding: 0 8px">+</div>
    <div style="flex-grow: 1"></div>
    <div class="t" style="color: #D6D9DD">21:07</div>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex">

    <div style="width: 124px; flex-shrink: 0; border-right: 1px solid #C6C9CD; display: flex; flex-direction: column; padding-top: 4px">
      <div class="t" style="height: 24px; display: flex; align-items: center; padding: 0 8px; background: #2F6FE0; color: #FFFFFF">Networks</div>
      <div class="t" style="height: 24px; display: flex; align-items: center; padding: 0 8px; color: #5C636B">libera.chat</div>
      <div class="t" style="height: 24px; display: flex; align-items: center; padding: 0 8px; color: #5C636B">oftc</div>
    </div>

    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; padding: 6px; gap: 6px">

      <div style="display: flex; align-items: baseline; gap: 8px; height: 18px">
        <div class="t" style="font-weight: 600">Networks</div>
        <div style="flex-grow: 1; height: 1px; background: #C6C9CD"></div>
      </div>

      <div style="flex-grow: 1; min-height: 0; border: 1px solid #C6C9CD; background: #F5F6F7; display: flex; flex-direction: column; overflow: hidden">
        <div style="display: flex; height: 22px; background: #E9EAEC; border-bottom: 1px solid #C6C9CD; align-items: center; padding: 0 6px; gap: 8px">
          <div class="t" style="flex-grow: 1; color: #5C636B">Network</div>
          <div class="t" style="width: 168px; color: #5C636B">Server</div>
          <div class="t" style="width: 96px; color: #5C636B">Nickname</div>
          <div class="t" style="width: 52px; color: #5C636B">TLS</div>
        </div>
        <sc-for list="{{rows}}" as="row" hint-placeholder-count="7">
          <div style="display: flex; height: 22px; align-items: center; padding: 0 6px; gap: 8px; background: {{row.ground}}; color: {{row.ink}}">
            <div class="t" style="flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{row.network}}</div>
            <div class="m" style="width: 168px; color: {{row.dim}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{row.server}}</div>
            <div class="m" style="width: 96px; color: {{row.dim}}">{{row.nick}}</div>
            <div class="t" style="width: 52px; color: {{row.dim}}">{{row.tls}}</div>
          </div>
        </sc-for>
      </div>

      <!-- What the chosen network is set to. One row, the way the network
           pane puts the chosen interface's settings under its list. -->
      <div style="display: flex; align-items: center; gap: 8px; height: 24px">
        <div class="t" style="width: 78px; flex-shrink: 0; color: #5C636B">Join on connect</div>
        <div style="flex-grow: 1; min-width: 0; height: 20px; border: 1px solid #C6C9CD; border-radius: 4px; background: #F5F6F7; display: flex; align-items: center; padding: 0 6px">
          <div class="m">#vibeee, #zig, #osdev</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; height: 24px">
        <div class="t" style="color: #5C636B; flex-grow: 1; min-width: 0">Connects when the machine has a network, and again when one comes back.</div>
        <div class="t" style="display: flex; align-items: center; justify-content: center; width: 72px; height: 22px; border-radius: 4px; border: 1px solid #C6C9CD; background: #E9EAEC">Forget</div>
        <div class="t" style="display: flex; align-items: center; justify-content: center; width: 72px; height: 22px; border-radius: 4px; border: 1px solid #2F6FE0; background: #2F6FE0; color: #FFFFFF">Connect</div>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { network: 'libera.chat', server: 'irc.libera.chat:6697', nick: 'kenny', tls: 'yes', open: true },
      { network: 'OFTC', server: 'irc.oftc.net:6697', nick: 'kenny', tls: 'yes' },
      { network: 'EFnet', server: 'irc.efnet.org:6697', nick: 'kenny', tls: 'yes' },
      { network: 'Rizon', server: 'irc.rizon.net:6697', nick: 'kenny', tls: 'yes' },
      { network: 'Undernet', server: 'irc.undernet.org:6667', nick: 'kenny', tls: 'no' },
      { network: 'QuakeNet', server: 'irc.quakenet.org:6667', nick: 'kenny', tls: 'no' },
      { network: 'hackint', server: 'irc.hackint.org:6697', nick: 'kenny', tls: 'yes' },
    ].map((row, i) => ({
      ...row,
      ground: row.open ? '#2F6FE0' : (i % 2 === 1 ? '#E9EAEC' : '#F5F6F7'),
      ink: row.open ? '#FFFFFF' : '#1A1D21',
      dim: row.open ? '#FFFFFF' : '#5C636B',
    }));
    return { rows };
  }
}
</script>
</body>
</html>
