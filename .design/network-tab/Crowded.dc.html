<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
    a { color: #2F6FE0; } a:hover { color: #1F4FA8; }
    .lbl { font-size: 12px; line-height: 18px; letter-spacing: 0.1px; }
  </style>
</helmet>

<div style="width: 640px; height: 400px; display: flex; background: #E9EAEC; color: #1A1D21; overflow: hidden">

  <!-- The rail: the settings sections, 124px as eui.rail fixes it -->
  <div style="width: 124px; flex-shrink: 0; background: #E9EAEC; border-right: 1px solid #C6C9CD; display: flex; flex-direction: column; padding-top: 6px">
    <div class="lbl" style="height: 24px; display: flex; align-items: center; padding: 0 8px; color: #5C636B">Display</div>
    <div class="lbl" style="height: 24px; display: flex; align-items: center; padding: 0 8px; background: #2F6FE0; color: #FFFFFF">Network</div>
    <div class="lbl" style="height: 24px; display: flex; align-items: center; padding: 0 8px; color: #5C636B">Input</div>
    <div class="lbl" style="height: 24px; display: flex; align-items: center; padding: 0 8px; color: #5C636B">Audio</div>
    <div class="lbl" style="height: 24px; display: flex; align-items: center; padding: 0 8px; color: #5C636B">Power</div>
    <div class="lbl" style="height: 24px; display: flex; align-items: center; padding: 0 8px; color: #5C636B">Help</div>
    <div class="lbl" style="height: 24px; display: flex; align-items: center; padding: 0 8px; color: #5C636B">About</div>
  </div>

  <!-- The pane -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 6px; gap: 6px; min-width: 0">

    <!-- Interfaces: one row each, name, state, address, switch -->
    <div style="display: flex; align-items: baseline; gap: 8px; height: 18px">
      <div class="lbl" style="font-weight: 600">Interfaces</div>
      <div style="flex-grow: 1; height: 1px; background: #C6C9CD"></div>
    </div>

    <div style="flex-shrink: 0; max-height: 100px; overflow-y: auto; border: 1px solid #C6C9CD; background: #F5F6F7; display: flex; flex-direction: column">
      <sc-for list="{{ifaces}}" as="i" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px; background: {{i.ground}}; color: {{i.ink}}; border-top: 1px solid {{i.rule}}">
          <div style="width: 12px; flex-shrink: 0; display: flex">
            <sc-if value="{{i.wired}}" hint-placeholder-val="{{ true }}">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="4.5" width="11" height="6" /><path d="M3 4.5V2.5h6v2" /></svg>
            </sc-if>
            <sc-if value="{{i.wireless}}" hint-placeholder-val="{{ false }}">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1"><path d="M1 4.5a7 7 0 0 1 10 0" /><path d="M3 7a4 4 0 0 1 6 0" /><circle cx="6" cy="9.5" r="0.9" fill="currentColor" stroke="none" /></svg>
            </sc-if>
          </div>
          <div class="lbl" style="width: 62px; flex-shrink: 0">{{i.name}}</div>
          <div class="lbl" style="width: 128px; flex-shrink: 0; color: {{i.dim}}">{{i.state}}</div>
          <div class="lbl" style="flex-grow: 1; min-width: 0; color: {{i.dim}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{i.address}}</div>
          <div style="width: 26px; height: 14px; flex-shrink: 0; border: 1px solid {{i.sw_line}}; background: {{i.sw_bg}}; display: flex; justify-content: {{i.sw_side}}; align-items: center; padding: 1px"><div style="width: 10px; height: 10px; background: {{i.sw_knob}}"></div></div>
        </div>
      </sc-for>
    </div>

    <!-- The selected interface's address mode, one row -->
    <div style="display: flex; align-items: center; gap: 8px; height: 24px">
      <div class="lbl" style="color: #5C636B; width: 62px; flex-shrink: 0">eth0</div>
      <div style="display: flex; border: 1px solid #C6C9CD; height: 20px; border-radius: 4px; overflow: hidden">
        <div class="lbl" style="display: flex; align-items: center; padding: 0 10px; background: #2F6FE0; color: #FFFFFF">DHCP</div>
        <div class="lbl" style="display: flex; align-items: center; padding: 0 10px; background: #E9EAEC; color: #1A1D21; border-left: 1px solid #C6C9CD">Static</div>
      </div>
      <div class="lbl" style="color: #5C636B; flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Renews in 41 min</div>
    </div>

    <!-- Wireless: the heading carries what the radio is doing -->
    <div style="display: flex; align-items: baseline; gap: 8px; height: 18px; margin-top: 2px">
      <div class="lbl" style="font-weight: 600">Wireless</div>
      <div style="flex-grow: 1; height: 1px; background: #C6C9CD"></div>
      <div class="lbl" style="color: #5C636B">Connected to cinaed</div>
    </div>

    <!-- What it heard -->
    <div style="flex-grow: 1; min-height: 110px; border: 1px solid #C6C9CD; background: #F5F6F7; display: flex; flex-direction: column; overflow: hidden">
      <div style="display: flex; height: 22px; background: #E9EAEC; border-bottom: 1px solid #C6C9CD; align-items: center; padding: 0 6px; gap: 8px">
        <div class="lbl" style="flex-grow: 1; color: #5C636B">Network</div>
        <div class="lbl" style="width: 30px; text-align: right; color: #5C636B">Ch</div>
        <div class="lbl" style="width: 78px; color: #5C636B">Signal</div>
        <div class="lbl" style="width: 56px; color: #5C636B">Security</div>
      </div>
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="5">
        <div style="display: flex; height: 22px; align-items: center; padding: 0 6px; gap: 8px; background: {{row.ground}}; color: {{row.ink}}">
          <div style="width: 12px; flex-shrink: 0; display: flex; align-items: center">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1"><path d="M1 4.5a7 7 0 0 1 10 0" /><path d="M3 7a4 4 0 0 1 6 0" /><circle cx="6" cy="9.5" r="0.9" fill="currentColor" stroke="none" /></svg>
          </div>
          <div class="lbl" style="flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{row.name}}</div>
          <div class="lbl" style="width: 30px; text-align: right">{{row.channel}}</div>
          <div style="width: 78px; display: flex; align-items: center; gap: 4px">
            <div style="display: flex; align-items: flex-end; gap: 1px; height: 9px">
              <div style="width: 2px; height: 3px; background: {{row.bar1}}"></div>
              <div style="width: 2px; height: 5px; background: {{row.bar2}}"></div>
              <div style="width: 2px; height: 7px; background: {{row.bar3}}"></div>
              <div style="width: 2px; height: 9px; background: {{row.bar4}}"></div>
            </div>
            <div class="lbl">{{row.dbm}}</div>
          </div>
          <div class="lbl" style="width: 56px">{{row.security}}</div>
        </div>
      </sc-for>
    </div>

    <!-- Act on the selection -->
    <div style="display: flex; align-items: center; gap: 8px; height: 24px">
      <div class="lbl" style="color: #5C636B; flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Scanning for networks</div>
      <div class="lbl" style="display: flex; align-items: center; justify-content: center; width: 72px; height: 22px; border: 1px solid #C6C9CD; background: #E9EAEC; border-radius: 4px; border-radius: 4px">Forget</div>
      <div class="lbl" style="display: flex; align-items: center; justify-content: center; width: 72px; height: 22px; border: 1px solid #2F6FE0; background: #2F6FE0; border-radius: 4px; border-radius: 4px; color: #FFFFFF">Join</div>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":640,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    const seen = [
      { name: 'eth0', state: 'Connected, 100 Mbit/s', address: '192.168.1.5', wired: true, on: true, sel: true },
      { name: 'wifi0', state: 'Connected', address: '192.168.1.31', wired: false, on: true },
      { name: 'usb0', state: 'Not connected', address: 'No IP address', wired: true, on: false },
      { name: 'eth1', state: 'No cable', address: 'No IP address', wired: true, on: true },
    ];
    const ifaces = seen.map((i, n) => ({
      ...i,
      wireless: !i.wired,
      ground: i.sel ? '#2F6FE0' : 'transparent',
      ink: i.sel ? '#FFFFFF' : '#1A1D21',
      dim: i.sel ? 'rgba(255,255,255,0.85)' : '#5C636B',
      rule: n === 0 ? 'transparent' : '#C6C9CD',
      sw_line: i.on ? (i.sel ? '#FFFFFF' : '#2F6FE0') : '#C6C9CD',
      sw_bg: i.on ? (i.sel ? '#FFFFFF' : '#2F6FE0') : '#E9EAEC',
      sw_knob: i.on ? (i.sel ? '#2F6FE0' : '#FFFFFF') : '#5C636B',
      sw_side: i.on ? 'flex-end' : 'flex-start',
    }));

    return { rows, ifaces };
  }
}
</script>
</body>
</html>
