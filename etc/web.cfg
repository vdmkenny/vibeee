# What the web reader does when nobody has said otherwise.
#
# The reader is not part of the system: it is built into home/bin and
# versioned on its own. Its settings are kept with everything else's all the
# same, so `cfg set web.homepage example.org` changes them, and a reader that
# is open sees the change without being started again.

# The page the reader opens when it is started without an address, and the
# one its home key goes to. Empty opens nothing, and the reader waits for an
# address.
homepage = https://frogfind.de/?lg=en-us

# Whether a page's pictures are fetched and shown in it. Off, a page is its
# words, with a picture's description where the picture would be, which is
# quicker over a slow connection and lighter on memory.
images = true
