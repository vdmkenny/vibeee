# The network. Every line is optional; these are the defaults.
#
# Written by cfgd: `cfg set net.if1_ssid kitchen`, and read again at every
# boot. A value set here is what an image ships with, which is how a
# machine that has no keyboard attached joins a network it has never seen.
#
# `cfg net` lists every key with what it accepts, and so does `man cfg`.

# What this machine calls itself wherever it has to give a name: the
# hostname in a lease request, and whatever later asks the same question.
# Unset takes vibeee- and the last three bytes of the first interface's
# address, which is stable across boots and different on every machine.
hostname =

# Four interface slots. Each names which interface it binds through a
# matcher: a class (ether, wifi), a driver name as `net` prints it, or a
# bus location. The most specific claim wins.
#
# Slot 0 takes any wired port and asks for a lease, which is the
# zero-configuration story.
if0_match = ether
if0_enabled = true
# Unset asks DHCP; "a.b.c.d/nn" claims an address instead, and then the
# gateway and the servers are yours to give too.
if0_address =
if0_gateway =
if0_dns =
# A wired slot joins nothing, so the radio's four keys sit unused here.
if0_ssid =
if0_psk =
if0_regdomain = conservative
if0_txpower = regulatory

# Slot 1 is the radio.
if1_match = wifi
if1_enabled = false
if1_address =
if1_gateway =
if1_dns =

# The network to join, and what to join it with. The secret may be the
# passphrase or the sixty-four hex digits it derives to. Prefer the
# derived key in an image somebody may read: it opens this one network,
# where a passphrase is often the words its owner uses elsewhere.
if1_ssid =
if1_psk =

# Which channel plan the radio obeys.
#
#   conservative  the narrowest plan, which every regulator permits
#   fcc           the Americas, eleven channels
#   etsi          Europe and most elsewhere, thirteen
#   mkk           Japan, fourteen
#   unrestricted  no plan: every channel, at the highest power the
#                 silicon accepts. For a bench, a screened room, or
#                 spectrum you hold. The radio says so when it starts.
if1_regdomain = conservative

# What it transmits at.
#
#   regulatory  whatever the plan above allows, which is the ordinary case
#   max         the highest the silicon will accept being told
#   <number>    that many decibel milliwatts, for reaching something the
#               plan's ceiling does not
#
# A number above the plan is taken as asked rather than clamped, and the
# radio says which plan it exceeded. Where the spectrum is not yours to
# use, that is a thing to have decided on purpose.
if1_txpower = regulatory

# Slots 2 and 3 are spare, and take the same keys as the two above. A
# machine with a second wired port, or one that should prefer a named
# network over whatever the radio finds, claims one of them.
if2_match =
if2_enabled = false
if2_address =
if2_gateway =
if2_dns =
if2_ssid =
if2_psk =
if2_regdomain = conservative
if2_txpower = regulatory

if3_match =
if3_enabled = false
if3_address =
if3_gateway =
if3_dns =
if3_ssid =
if3_psk =
if3_regdomain = conservative
if3_txpower = regulatory
