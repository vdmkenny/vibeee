# The desktop. Every line is optional; these are the defaults.
#
# Written by cfgd, and readable by anything: `cfg set wm.theme dusk` and the
# Settings app both arrive here.

# slate, classic, paper, dusk
theme = slate

# top or bottom
bar = top

# The desktop behind everything, as #rrggbb. Unset takes the theme's own,
# so changing the theme changes the wall with it until this says otherwise.
wallpaper =

# master's share of the screen, per cent
master = 58
