# Where the machine's own account of itself goes.
#
# This machine has no serial port of its own, which is the single thing
# that most shapes how it is debugged: what it says is read off a
# photograph of the screen, or out of the record afterwards with `log`.
# A USB serial adapter gives it one.
#
# Name the port here and everything the machine says goes down it as it is
# said, from the moment the bus finds the adapter. `ser` lists the ports;
# the name is the one in its first column.
#
# Empty sends it nowhere, which is right for a machine with nothing
# plugged in: there is no port to hunt for.
console =
