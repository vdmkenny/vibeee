# What keeps the machine going, and what it does when that runs out.
#
# The backlight is most of what this machine draws, so what happens when it
# is left alone is most of what decides how long a charge lasts. Written by
# cfgd, and readable by anything: `cfg set power.dim_after 5m` and the
# Settings app both arrive here.

# How long before the panel dims, and how long before the screen goes off.
# never, 30s, 1m, 5m, 10m, 30m
dim_after = 1m
blank_after = 10m

# How dim "dim" is, as a share of the level in use. Low enough to save
# something, high enough that the screen has not apparently gone off.
dim_to = 30

# What to do when the battery reaches the level below: warn, sleep, shut_down.
#
# A choice made before it happens, which is the only time it can be made: a
# machine at three per cent has no time to ask.
low_action = shut_down
low_at = 5
