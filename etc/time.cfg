# Where the machine learns what time it is.
#
# A netbook of this age has usually lost the battery that kept its clock
# running, so it wakes not knowing the date at all. Everything dated depends
# on this being fixed from the network: a file's timestamp, a lease, and a
# certificate's validity, which cannot be judged by a machine that thinks it
# is 1970.

# Whether to ask the network at all.
ntp = true

# Who to ask, in order, until one answers. Names rather than addresses: the
# pools move, and a machine that hard-coded one would end up asking a server
# that has since become somebody's laptop.
server1 = 0.pool.ntp.org
server2 = 1.pool.ntp.org
server3 = time.cloudflare.com

# How often to ask again, in minutes. This clock is a crystal counted by
# software, so it drifts; an hour is often enough to stay close and rare
# enough to be no burden on a public pool.
every_minutes = 60
