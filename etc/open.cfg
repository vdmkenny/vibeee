# Which program opens what.
#
# A program says what it is willing to open; these keys say which of them to
# prefer when more than one would. Empty means the first that will take it,
# which is the right answer on a machine carrying one of each. Written by
# cfgd, and readable by anything: `cfg set open.text pad` and the Settings
# app both arrive here.
#
# The names are a program's own, as the shell knows it: pad, not /bin/pad.
# A name nothing answers to, or one that answers but will not take the kind
# in question, falls back rather than failing: a file still opens.

# Words.
text =

# Pictures this build can decode, and the ones it can only name.
picture =

# Nothing here plays sound or shows video yet, so these open nothing until
# something registers for them.
audio =
video =

# Things with other things inside them, documents, and typefaces.
archive =
document =
font =
